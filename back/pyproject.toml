[project]
name = "assocore-api"
version = "0.1.0"
description = "AssoCORE FastAPI backend with Nextcloud integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "email-validator>=2.3.0",
    "fastapi>=0.135.1",
    "nc-py-api>=0.24.2",
    "bcrypt==5.0.0",
    "cryptography>=44.0.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.22",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.48",
    "slowapi>=0.1.9",
    "uvicorn>=0.41.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
