services:
  # ============================================================================
  # SHARED SERVICES (used by both dev and prod)
  # ============================================================================

  # Database for Nextcloud
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./data/db:/var/lib/mysql
    env_file:
      - back/.env
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_DATABASE=${NEXTCLOUD_DB_NAME}
      - MARIADB_USER=${NEXTCLOUD_DB_USER}
      - MARIADB_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - assocore

  # Redis cache
  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - assocore

  # Nextcloud instance
  nextcloud:
    image: nextcloud:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - db
      - redis
    env_file:
      - back/.env
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME}
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=redis
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost:8081 nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - ./data/nextcloud:/var/www/html
    networks:
      - assocore

  # ============================================================================
  # DEVELOPMENT SERVICES (default profile)
  # ============================================================================

  # Backend API - Development
  backend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - nextcloud
    env_file:
      - back/.env
    environment:
      - DATABASE_URL=mysql+aiomysql://${NEXTCLOUD_DB_USER}:${NEXTCLOUD_DB_PASSWORD}@db:3306/${NEXTCLOUD_DB_NAME}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - ENVIRONMENT=development
    volumes:
      - ./back:/app
    networks:
      - assocore

  # Frontend - Development
  frontend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./front:/app
      - /app/node_modules
    networks:
      - assocore

  # Mobile APK builder - Development
  mobile:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/mobile.Dockerfile
      target: development
    volumes:
      - ./build/mobile:/output
      - ./mobile:/app
    networks:
      - assocore

  # ============================================================================
  # PRODUCTION SERVICES (prod profile)
  # ============================================================================

  # Backend API - Production
  backend_prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
      args:
        - BUILD_ENV=production
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - nextcloud
    env_file:
      - back/.env
    environment:
      - DATABASE_URL=mysql+aiomysql://${NEXTCLOUD_DB_USER}:${NEXTCLOUD_DB_PASSWORD}@db:3306/${NEXTCLOUD_DB_NAME}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - ENVIRONMENT=production
    networks:
      - assocore

  # Frontend - Production
  frontend_prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
      args:
        - BUILD_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend_prod
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend_prod:8000
    networks:
      - assocore

  # Mobile APK builder - Production (Release build)
  mobile_prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/mobile.Dockerfile
      target: production
      args:
        - BUILD_ENV=production
    volumes:
      - ./build/mobile:/output
    networks:
      - assocore

networks:
  assocore:
    driver: bridge

