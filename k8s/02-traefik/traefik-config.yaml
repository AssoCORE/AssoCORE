---
# Traefik ConfigMap with static configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: assocore
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
data:
  traefik.yaml: |
    # Static Configuration
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    # Entry Points
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        address: ":443"
        http:
          tls:
            certResolver: letsencrypt
      traefik:
        address: ":9000"

    # API and Dashboard
    api:
      dashboard: true
      insecure: true  # Enable for local development

    # Ping
    ping:
      entryPoint: traefik

    # Providers
    providers:
      kubernetesIngress:
        ingressClass: traefik
      kubernetesCRD:
        allowCrossNamespace: true

    # Certificate Resolvers
    certificatesResolvers:
      letsencrypt:
        acme:
          email: admin@assocore.org  # CHANGE THIS
          storage: /data/acme.json
          caServer: https://acme-v02.api.letsencrypt.org/directory
          # For testing, use staging:
          # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
          httpChallenge:
            entryPoint: web
          tlsChallenge: {}

    # Logging
    log:
      level: INFO
      format: json

    # Access Logs
    accessLog:
      format: json
      filters:
        statusCodes:
          - "400-599"

    # Metrics
    metrics:
      prometheus:
        entryPoint: traefik
        addServicesLabels: true
        addEntryPointsLabels: true
