---
# IngressRoute for Traefik Dashboard
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: assocore
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.assocore.org`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: traefik-dashboard-auth
  tls:
    certResolver: letsencrypt

---
# BasicAuth Middleware for Dashboard
# Generate password: htpasswd -nb admin password | base64
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: assocore
spec:
  basicAuth:
    secret: traefik-dashboard-auth-secret

---
# Dashboard Auth Secret
# This secret is created automatically by create-app-secrets.sh
# DO NOT create this secret manually!
#
# The secret is generated from credentials in k8s/.env:
#   TRAEFIK_DASHBOARD_USER=admin
#   TRAEFIK_DASHBOARD_PASSWORD=<your-secure-password>
#
# To create the secret, run:
#   ./k8s/01-secrets/create-app-secrets.sh
#
# Manual creation (if needed):
#   htpasswd -nb admin your-password | kubectl create secret generic traefik-dashboard-auth-secret \
#     --from-file=users=/dev/stdin --namespace=assocore --dry-run=client -o yaml | kubectl apply -f -
#
# The secret should have this structure:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: traefik-dashboard-auth-secret
#   namespace: assocore
# type: Opaque
# data:
#   users: <base64-encoded-htpasswd-entry>

