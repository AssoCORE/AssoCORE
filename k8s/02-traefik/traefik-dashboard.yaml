---
# IngressRoute for Traefik Dashboard
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: assocore
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.assocore.org`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: traefik-dashboard-auth
  tls:
    certResolver: letsencrypt

---
# BasicAuth Middleware for Dashboard
# Generate password: htpasswd -nb admin password | base64
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: assocore
spec:
  basicAuth:
    secret: traefik-dashboard-auth-secret

---
# Dashboard Auth Secret
# Change the password before deploying!
# Generate with: echo "admin:$(openssl passwd -apr1 your-password)" | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dashboard-auth-secret
  namespace: assocore
type: Opaque
data:
  # Default: admin/admin (CHANGE THIS!)
  # Generated with: htpasswd -nb admin admin | base64
  users: YWRtaW46JGFwcjEkSDZ4dUw2TDgkSnNzU1NBbjFwY1h4YXBSOHIuUm5YLwoK
