---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: assocore
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
data:
  # No NEXT_PUBLIC_* here: Next.js inlines those at build time, so setting one as a
  # runtime env var on a standalone build has no effect. Nothing read it anyway.
  NODE_ENV: "production"
  # Server-only; the Next.js server calls FastAPI server-to-server (not
  # subject to browser CORS), so this is never exposed to the browser.
  BACKEND_URL: "http://backend.assocore.svc.cluster.local:8000"
