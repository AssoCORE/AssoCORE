---
# Watchtower Deployment for k3s/k3d (uses containerd instead of Docker)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchtower
  namespace: assocore
  labels:
    app.kubernetes.io/name: watchtower
    app.kubernetes.io/instance: watchtower
spec:
  # Set to 0 to disable Watchtower (recommended for development)
  # Set to 1 to enable automated image updates
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: watchtower
      app.kubernetes.io/instance: watchtower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchtower
        app.kubernetes.io/instance: watchtower
      annotations:
        # Note about containerd compatibility
        description: "Watchtower is disabled by default - not compatible with containerd in k3s"
    spec:
      serviceAccountName: watchtower
      containers:
        - name: watchtower
          image: containrrr/watchtower:latest
          imagePullPolicy: IfNotPresent
          env:
            # Check for updates every 5 minutes
            - name: WATCHTOWER_POLL_INTERVAL
              value: "300"
            
            # Only update containers with this label
            - name: WATCHTOWER_LABEL_ENABLE
              value: "true"
            
            # Remove old images after update
            - name: WATCHTOWER_CLEANUP
              value: "true"
            
            # Include stopped containers
            - name: WATCHTOWER_INCLUDE_STOPPED
              value: "false"
            
            # Include restarting containers
            - name: WATCHTOWER_INCLUDE_RESTARTING
              value: "true"
            
            # Monitor only containers in assocore namespace
            - name: WATCHTOWER_SCOPE
              value: "assocore"
            
            # Timezone
            - name: TZ
              value: "Europe/Paris"
          
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          
          securityContext:
            allowPrivilegeEscalation: false
            # Note: readOnlyRootFilesystem conflicts with Docker socket access
            readOnlyRootFilesystem: false
            runAsNonRoot: false  # Docker socket requires root
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          
          # NOTE: Watchtower requires Docker socket
          # k3s uses containerd by default, not Docker
          # This will cause CrashLoopBackOff or ContainerCreating errors
          volumeMounts:
            - name: container-socket
              mountPath: /var/run/docker.sock
              readOnly: false
      
      volumes:
        # For Docker runtime (standard Docker)
        - name: container-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        
        # For containerd runtime (k3s) - Uncomment to use:
        # - name: container-socket
        #   hostPath:
        #     path: /run/k3s/containerd/containerd.sock
        #     type: Socket

---
# Watchtower ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchtower
  namespace: assocore
  labels:
    app.kubernetes.io/name: watchtower
    app.kubernetes.io/instance: watchtower

---
# Watchtower Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: watchtower
  namespace: assocore
  labels:
    app.kubernetes.io/name: watchtower
    app.kubernetes.io/instance: watchtower
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
# Watchtower RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: watchtower
  namespace: assocore
  labels:
    app.kubernetes.io/name: watchtower
    app.kubernetes.io/instance: watchtower
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watchtower
subjects:
  - kind: ServiceAccount
    name: watchtower
    namespace: assocore
