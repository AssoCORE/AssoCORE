---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: assocore
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: nextcloud
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud
  namespace: assocore
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: assocore
spec:
  serviceName: nextcloud
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/component: storage
    spec:
      initContainers:
        # Wait for database and redis to be ready
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MariaDB..."
              until nc -z mariadb.assocore.svc.cluster.local 3306; do
                sleep 2
              done
              echo "MariaDB is ready!"
              
              echo "Waiting for Redis..."
              until nc -z redis.assocore.svc.cluster.local 6379; do
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: nextcloud
          image: nextcloud:28-apache
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: mysql-password
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: nextcloud-admin-user
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: nextcloud-admin-password
          envFrom:
            - configMapRef:
                name: nextcloud-config
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.assocore.localhost
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.assocore.localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nextcloud
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
