---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: assocore
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: assocore
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: assocore
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # Wait for database to be ready
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mariadb.assocore.svc.cluster.local 3306; do
                echo "Waiting for MariaDB to be ready..."
                sleep 2
              done
              echo "MariaDB is ready!"
        # Auth revocation state lives in redis; start after it is reachable.
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis.assocore.svc.cluster.local 6379; do
                echo "Waiting for Redis to be ready..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: backend
          image: ghcr.io/assocore/assocore/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: database-url
          envFrom:
            - configMapRef:
                name: backend-config
            # SECRET_KEY, ADMIN_PASSWORD, NEXTCLOUD_ADMIN_PASSWORD, NC_APP_PASSWORD_KEY.
            # optional: true so a cluster without the secret still rolls out (the admin
            # seeder just skips) instead of wedging pods in CreateContainerConfigError.
            # Create it with:
            #   kubectl -n assocore create secret generic backend-secret \
            #     --from-literal=SECRET_KEY=... --from-literal=ADMIN_PASSWORD=... \
            #     --from-literal=NEXTCLOUD_ADMIN_PASSWORD=... \
            #     --from-literal=NC_APP_PASSWORD_KEY=...
            - secretRef:
                name: backend-secret
                optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
