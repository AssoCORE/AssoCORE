---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: assocore
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
data:
  # Backend environment configuration
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  # Database connection will use mariadb service
  DB_HOST: "mariadb.assocore.svc.cluster.local"
  DB_PORT: "3306"
  # Auth state (revoked access tokens, refresh tokens). DB 1 keeps it off Nextcloud's DB 0.
  REDIS_URL: "redis://redis.assocore.svc.cluster.local:6379/1"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  REFRESH_GRACE_SECONDS: "10"
  AUTH_REDIS_STRICT: "true"
  # Internal URL for API -> Nextcloud calls; public URL for links handed to a browser.
  NEXTCLOUD_URL: "http://nextcloud.assocore.svc.cluster.local"
  NEXTCLOUD_PUBLIC_URL: "https://cloud.assocore.local"
  NEXTCLOUD_ADMIN_USER: "admin"
  NC_LOGIN_SELF_HEAL: "true"
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@assocore.local"
