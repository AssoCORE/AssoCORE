---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: assocore
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
